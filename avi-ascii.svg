<svg xmlns="http://www.w3.org/2000/svg" width="448" height="276" viewBox="0 0 448 276" font-family="'Segoe UI Rounded', 'SF Pro Rounded', 'Baloo 2', 'Quicksand', 'Segoe UI', system-ui, -apple-system, sans-serif">

<defs>
  <clipPath id="cardclip"><rect width="448" height="276" rx="24"/></clipPath>
  <clipPath id="gridclip"><rect x="24" y="24" width="400" height="212"/></clipPath>
  <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#93C5FD" stop-opacity="0"/>
    <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
  </linearGradient>
  <mask id="sweepMask">
    <rect class="sweep" y="24" width="140" height="212" fill="url(#sweepGrad)"/>
  </mask>
</defs>
<style>
  text { font: 4px monospace; white-space: pre; }
  .base { fill: #4C5C82; }
  .sweep-text { fill: #93C5FD; }
  .sweep { animation: sweep 5s linear infinite; }
  @keyframes sweep {
    from { transform: translateX(-140px); }
    to   { transform: translateX(400px); }
  }
  .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.7); } }
</style>
