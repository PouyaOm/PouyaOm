<svg
      xmlns="http://www.w3.org/2000/svg"
      width="1200"
      height="300"
      viewBox="0 0 1200 300"
      font-family="'Segoe UI Rounded', 'SF Pro Rounded', 'Baloo 2', 'Quicksand', 'Segoe UI', system-ui, sans-serif">


<defs>

  <linearGradient
    id="bg"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%">

    <stop offset="0%" stop-color="#0B1120"/>
    <stop offset="55%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#1E1B4B"/>

  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="30"/>
  </filter>

  <clipPath id="clip">
    <rect width="1200" height="300" rx="26"/>
  </clipPath>

</defs>

<style>

  .background {
    animation: backgroundMove 10s ease-in-out infinite alternate;
    transform-origin: center;
  }

  @keyframes backgroundMove {

    from {
      transform: scale(1);
    }

    to {
      transform: scale(1.035);
    }

  }


  .orb1 {
    animation: orb1 9s ease-in-out infinite;
  }

  .orb2 {
    animation: orb2 11s ease-in-out infinite;
  }

  @keyframes orb1 {

    0%,100% {
      transform: translate(0,0);
    }

    50% {
      transform: translate(-25px,20px);
    }

  }

  @keyframes orb2 {

    0%,100% {
      transform: translate(0,0);
    }

    50% {
      transform: translate(25px,-20px);
    }

  }


  .tech {
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {

    0%,100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-4px);
    }

  }


  .social {
    animation: socialFloat 5s ease-in-out infinite;
  }

  @keyframes socialFloat {

    0%,100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-2px);
    }

  }

  text {
    shape-rendering: geometricPrecision;
  }

</style>


<g clip-path="url(#clip)">

  <rect
    class="background"
    width="1200"
    height="300"
    fill="url(#bg)"
  />

  <circle
    class="orb1"
    cx="1080"
    cy="50"
    r="150"
    fill="#312E81"
    opacity="0.35"
    filter="url(#blur)"
  />

  <circle
    class="orb2"
    cx="80"
    cy="260"
    r="150"
    fill="#1D4ED8"
    opacity="0.20"
    filter="url(#blur)"
  />

</g>


