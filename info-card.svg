<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="'Segoe UI Rounded', 'SF Pro Rounded', 'Baloo 2', 'Quicksand', 'Segoe UI', system-ui, -apple-system, sans-serif">

<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0B1120"/><stop offset="55%" stop-color="#111827"/><stop offset="100%" stop-color="#1E1B4B"/>
  </linearGradient>
  <clipPath id="clip"><rect width="480" height="300" rx="24"/></clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<style>
  text { shape-rendering: geometricPrecision; }
  .bg-anim { animation: hue 10s ease-in-out infinite alternate; }
  @keyframes hue { from { filter: hue-rotate(-6deg); } to { filter: hue-rotate(6deg); } }
  .blob { opacity: .45; }
  .blob1 { animation: float1 9s ease-in-out infinite; }
  .blob2 { animation: float2 11s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(16px,-14px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-14px,12px); } }
  .wave { display: inline-block; transform-origin: 70% 75%; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(14deg); }
    30% { transform: rotate(-8deg); }
    45% { transform: rotate(14deg); }
    60% { transform: rotate(-4deg); }
    75% { transform: rotate(10deg); }
  }
  .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.7); } }
  .underline { stroke-dasharray: 220; animation: draw 2.4s ease-out forwards; }
  @keyframes draw { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
</style>
<g clip-path="url(#clip)">
  <g class="bg-anim"><rect width="480" height="300" fill="url(#bg)"/></g>
  <circle class="blob blob1" cx="420" cy="50" r="90" fill="#312E81" filter="url(#soft)"/>
  <circle class="blob blob2" cx="40" cy="260" r="110" fill="#312E81" filter="url(#soft)"/>
</g>
<rect x="0.5" y="0.5" width="479" height="299" rx="24" fill="none" stroke="rgba(255,255,255,0.10)"/>

<text x="28" y="52" font-size="24" font-weight="800" fill="#E5E7EB"><tspan class="wave">👋</tspan> Hey, I&#x27;m PouyaOm</text>
<text x="28" y="80" font-size="14" fill="rgba(229,231,235,0.62)">Self-taught developer building cool stuff</text>
<rect x="28" y="108" width="76" height="30" rx="15.0" fill="rgba(59,130,246,0.14)" stroke="rgba(96,165,250,0.4)"/><text x="66" y="128" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Python</text>
<rect x="114.36" y="108" width="109" height="30" rx="15.0" fill="rgba(16,185,129,0.14)" stroke="rgba(52,211,153,0.4)"/><text x="169" y="128" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">JavaScript</text>
<rect x="232.96" y="108" width="68" height="30" rx="15.0" fill="rgba(244,63,94,0.14)" stroke="rgba(251,113,133,0.4)"/><text x="267" y="128" font-size="13" font-weight="700" fill="#FDA4AF" text-anchor="middle">React</text>
<rect x="28" y="152" width="230" height="30" rx="15.0" fill="rgba(217,119,6,0.14)" stroke="rgba(251,191,36,0.4)"/><text x="143" y="172" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="middle">🌱 Open source contributor</text>
<circle class="dot" cx="33" cy="200" r="5" fill="#34D399"/>
<text x="48" y="204" font-size="13" fill="rgba(229,231,235,0.62)">Currently building something new</text>
<text x="28" y="274" font-size="14" font-weight="700" fill="#60A5FA">@PouyaOm</text>
<path class="underline" d="M28 280 q 38 8 76 0" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>